name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release'
        required: false
        default: 'false'
        type: boolean
      skip_linux:
        description: 'Skip Linux builds'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SVN_VERSION: '1.14.5'

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    env:
      PUBLIC_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.create_release == 'true' }}
      HAS_MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE_BASE64 != '' }}
      HAS_MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD != '' }}
      HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
      HAS_APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
      HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
      HAS_WIN_CERTIFICATE: ${{ secrets.WIN_CERTIFICATE_BASE64 != '' }}
      HAS_WIN_CERTIFICATE_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate public release version
        if: env.PUBLIC_RELEASE == 'true'
        run: node scripts/validate-release-version.mjs "$GITHUB_REF_NAME"

      - name: Validate stable release signing
        if: env.PUBLIC_RELEASE == 'true' && !contains(github.ref_name, '-')
        run: |
          set -euo pipefail
          missing=()
          for name in HAS_MAC_CERTIFICATE HAS_MAC_CERTIFICATE_PASSWORD HAS_APPLE_ID HAS_APPLE_APP_PASSWORD HAS_APPLE_TEAM_ID HAS_WIN_CERTIFICATE HAS_WIN_CERTIFICATE_PASSWORD; do
            if [ "${!name}" != "true" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing public-release signing configuration: ${missing[*]}"
            exit 1
          fi

  # ============================================
  # Build SVN Binaries (with caching)
  # ============================================
  svn-binaries:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32
            arch: x64
            runner: windows-latest
            artifact-name: svn-win32-x64
          - platform: darwin
            arch: x64
            runner: macos-15-intel
            artifact-name: svn-darwin-x64
          - platform: darwin
            arch: arm64
            runner: macos-14
            artifact-name: svn-darwin-arm64
          - platform: linux
            arch: x64
            runner: ubuntu-22.04
            artifact-name: svn-linux-x64

    steps:
      - name: Cache SVN binaries
        id: cache-svn
        uses: actions/cache@v5
        with:
          path: binaries/${{ matrix.platform }}-${{ matrix.arch }}
          key: svn-${{ matrix.platform }}-${{ matrix.arch }}-${{ env.SVN_VERSION }}

      - name: Download SVN for Windows
        if: matrix.platform == 'win32' && steps.cache-svn.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path binaries\win32-x64\svn
          $svnUrl = "https://www.visualsvn.com/files/Apache-Subversion-${{ env.SVN_VERSION }}-3.zip"
          Write-Host "Downloading SVN from $svnUrl"
          Invoke-WebRequest -Uri $svnUrl -OutFile svn.zip
          Expand-Archive -Path svn.zip -DestinationPath svn-temp
          Move-Item -Path "svn-temp\bin\*" -Destination "binaries\win32-x64\svn\" -Force
          binaries\win32-x64\svn\svn.exe --version
          Remove-Item svn.zip, svn-temp -Recurse -Force

      - name: Download SVN for macOS
        if: matrix.platform == 'darwin' && steps.cache-svn.outputs.cache-hit != 'true'
        run: |
          mkdir -p binaries/${{ matrix.platform }}-${{ matrix.arch }}/svn/lib
          brew install subversion dylibbundler
          SVN_PATH=$(which svn)
          echo "SVN installed at: $SVN_PATH"
          svn --version
          cp "$SVN_PATH" binaries/${{ matrix.platform }}-${{ matrix.arch }}/svn/
          dylibbundler -od -b \
            -x binaries/${{ matrix.platform }}-${{ matrix.arch }}/svn/svn \
            -d binaries/${{ matrix.platform }}-${{ matrix.arch }}/svn/lib \
            -p @executable_path/lib
          chmod +x binaries/${{ matrix.platform }}-${{ matrix.arch }}/svn/svn
          binaries/${{ matrix.platform }}-${{ matrix.arch }}/svn/svn --version

      - name: Install SVN for Linux
        if: matrix.platform == 'linux' && steps.cache-svn.outputs.cache-hit != 'true'
        run: |
          mkdir -p binaries/linux-x64/svn
          sudo apt-get update
          sudo apt-get install -y subversion
          SVN_PATH=$(which svn)
          echo "SVN installed at: $SVN_PATH"
          svn --version
          # Copy svn binary and its dependencies
          cp "$SVN_PATH" binaries/linux-x64/svn/
          # Get shared library dependencies and copy them
          ldd "$SVN_PATH" | grep "=> /" | awk '{print $3}' | xargs -I '{}' cp -v '{}' binaries/linux-x64/svn/ 2>/dev/null || true
          chmod +x binaries/linux-x64/svn/svn
          binaries/linux-x64/svn/svn --version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: binaries/${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 1

  # ============================================
  # Build Logic Engine (with caching)
  # ============================================
  logic-engine:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32
            arch: x64
            runner: windows-latest
            target: bun-windows-x64
            ext: .exe
            artifact-name: shelly-engine-win32-x64
          - platform: darwin
            arch: x64
            runner: macos-15-intel
            target: bun-darwin-x64
            ext: ''
            artifact-name: shelly-engine-darwin-x64
          - platform: darwin
            arch: arm64
            runner: macos-14
            target: bun-darwin-arm64
            ext: ''
            artifact-name: shelly-engine-darwin-arm64
          - platform: linux
            arch: x64
            runner: ubuntu-22.04
            target: bun-linux-x64
            ext: ''
            artifact-name: shelly-engine-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate cache key from source
        id: cache-key
        run: |
          echo "key=logic-engine-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('packages/logic-engine/**/*.ts', 'packages/logic-engine/package.json', 'bun.lock') }}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache Logic Engine binary
        id: cache-engine
        uses: actions/cache@v5
        with:
          path: binaries/${{ matrix.platform }}-${{ matrix.arch }}
          key: ${{ steps.cache-key.outputs.key }}

      - name: Setup Bun
        if: steps.cache-engine.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Install dependencies
        if: steps.cache-engine.outputs.cache-hit != 'true'
        working-directory: packages/logic-engine
        run: bun install --frozen-lockfile

      - name: Build binary
        if: steps.cache-engine.outputs.cache-hit != 'true'
        working-directory: packages/logic-engine
        run: bun build ./src/index.ts --compile --target=${{ matrix.target }} --outfile=dist/shelly-engine${{ matrix.ext }} --minify --define ENGINE_VERSION='"${{ github.ref_name }}"' --define BUILD_SHA='"${{ github.sha }}"'

      - name: Verify binary
        if: steps.cache-engine.outputs.cache-hit != 'true'
        working-directory: packages/logic-engine
        run: ./dist/shelly-engine${{ matrix.ext }} --version

      - name: Move to binaries directory
        if: steps.cache-engine.outputs.cache-hit != 'true'
        run: |
          mkdir -p binaries/${{ matrix.platform }}-${{ matrix.arch }}
          mv packages/logic-engine/dist/shelly-engine${{ matrix.ext }} binaries/${{ matrix.platform }}-${{ matrix.arch }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: binaries/${{ matrix.platform }}-${{ matrix.arch }}/shelly-engine${{ matrix.ext }}
          retention-days: 1

  # ============================================
  # Build Electron App - macOS
  # ============================================
  build-macos:
    needs: [release-readiness, svn-binaries, logic-engine]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PUBLIC_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.create_release == 'true' }}
      HAS_MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE_BASE64 != '' }}
      HAS_MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD != '' }}
      HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
      HAS_APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
      HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download SVN binaries
        uses: actions/download-artifact@v7
        with:
          name: svn-darwin-${{ matrix.arch }}
          path: binaries/darwin-${{ matrix.arch }}

      - name: Download Logic Engine
        uses: actions/download-artifact@v7
        with:
          name: shelly-engine-darwin-${{ matrix.arch }}
          path: binaries/darwin-${{ matrix.arch }}

      - name: Make binaries executable
        run: |
          chmod +x binaries/darwin-${{ matrix.arch }}/shelly-engine
          chmod +x binaries/darwin-${{ matrix.arch }}/svn/svn

      - name: Verify bundled binaries
        run: bun run verify:binaries darwin-${{ matrix.arch }}

      - name: Generate macOS icon
        run: |
          set -euo pipefail
          mkdir -p build/icon.iconset
          sips -z 16 16 build/icon.png --out build/icon.iconset/icon_16x16.png
          sips -z 32 32 build/icon.png --out build/icon.iconset/icon_16x16@2x.png
          sips -z 32 32 build/icon.png --out build/icon.iconset/icon_32x32.png
          sips -z 64 64 build/icon.png --out build/icon.iconset/icon_32x32@2x.png
          sips -z 128 128 build/icon.png --out build/icon.iconset/icon_128x128.png
          sips -z 256 256 build/icon.png --out build/icon.iconset/icon_128x128@2x.png
          sips -z 256 256 build/icon.png --out build/icon.iconset/icon_256x256.png
          sips -z 512 512 build/icon.png --out build/icon.iconset/icon_256x256@2x.png
          sips -z 512 512 build/icon.png --out build/icon.iconset/icon_512x512.png
          cp build/icon.png build/icon.iconset/icon_512x512@2x.png
          iconutil -c icns build/icon.iconset -o build/icon.icns

      - name: Cache Electron build output
        uses: actions/cache@v5
        with:
          path: |
            out
            .cache
          key: electron-out-${{ matrix.arch }}-${{ hashFiles('src/**/*', 'package.json', 'bun.lock') }}
          restore-keys: |
            electron-out-${{ matrix.arch }}-

      - name: Build frontend
        run: bun run build

      - name: Build Electron app (unsigned)
        if: ${{ env.HAS_MAC_CERTIFICATE == 'false' || env.HAS_MAC_CERTIFICATE_PASSWORD == 'false' || env.HAS_APPLE_ID == 'false' || env.HAS_APPLE_APP_PASSWORD == 'false' || env.HAS_APPLE_TEAM_ID == 'false' }}
        run: bunx electron-builder --mac --${{ matrix.arch }} --config --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Warn about unsigned public macOS release
        if: ${{ env.PUBLIC_RELEASE == 'true' && (env.HAS_MAC_CERTIFICATE == 'false' || env.HAS_MAC_CERTIFICATE_PASSWORD == 'false' || env.HAS_APPLE_ID == 'false' || env.HAS_APPLE_APP_PASSWORD == 'false' || env.HAS_APPLE_TEAM_ID == 'false') }}
        run: |
          echo "::warning::Building an unsigned, unnotarized public macOS release because signing credentials are incomplete."
          echo "::warning::Set MAC_CERTIFICATE_BASE64, MAC_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID before publishing a trusted macOS release."

      - name: Build Electron app (signed)
        if: ${{ env.HAS_MAC_CERTIFICATE == 'true' && env.HAS_MAC_CERTIFICATE_PASSWORD == 'true' && env.HAS_APPLE_ID == 'true' && env.HAS_APPLE_APP_PASSWORD == 'true' && env.HAS_APPLE_TEAM_ID == 'true' }}
        run: bunx electron-builder --mac --${{ matrix.arch }} --config --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: true
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Validate public macOS artifact
        if: ${{ env.PUBLIC_RELEASE == 'true' && env.HAS_MAC_CERTIFICATE == 'true' && env.HAS_MAC_CERTIFICATE_PASSWORD == 'true' && env.HAS_APPLE_ID == 'true' && env.HAS_APPLE_APP_PASSWORD == 'true' && env.HAS_APPLE_TEAM_ID == 'true' }}
        run: |
          set -euo pipefail
          dmg_path="$(find release -type f -name '*.dmg' | head -n 1)"
          if [ -z "$dmg_path" ]; then
            echo "No macOS DMG found for validation."
            exit 1
          fi

          mount_path="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_path" -quiet || true
            rmdir "$mount_path" || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg_path" -nobrowse -quiet -mountpoint "$mount_path"
          app_path="$(find "$mount_path" -maxdepth 2 -type d -name '*.app' | head -n 1)"
          if [ -z "$app_path" ]; then
            echo "No app bundle found in $dmg_path."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$dmg_path" || xcrun stapler validate "$app_path"
          expected_version="$(node -p "require('./package.json').version")"
          smoke_output="$("$app_path/Contents/MacOS/ShellySVN" --smoke-test)"
          echo "$smoke_output"
          echo "$smoke_output" | grep -F "ShellySVN $expected_version"

      - name: Smoke test packaged macOS app
        if: ${{ env.PUBLIC_RELEASE == 'false' || env.HAS_MAC_CERTIFICATE == 'false' || env.HAS_MAC_CERTIFICATE_PASSWORD == 'false' || env.HAS_APPLE_ID == 'false' || env.HAS_APPLE_APP_PASSWORD == 'false' || env.HAS_APPLE_TEAM_ID == 'false' }}
        run: |
          set -euo pipefail
          app_path="$(find release -type d -name 'ShellySVN.app' | head -n 1)"
          if [ -z "$app_path" ]; then
            echo "No packaged macOS app bundle found for smoke testing."
            exit 1
          fi
          expected_version="$(node -p "require('./package.json').version")"
          smoke_output="$("$app_path/Contents/MacOS/ShellySVN" --smoke-test)"
          echo "$smoke_output"
          echo "$smoke_output" | grep -F "ShellySVN $expected_version"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ShellySVN-macOS-${{ matrix.arch }}
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/latest-mac.yml
            release/**/*.blockmap
          retention-days: 7
          if-no-files-found: error

  # ============================================
  # Build Electron App - Windows
  # ============================================
  build-windows:
    needs: [release-readiness, svn-binaries, logic-engine]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PUBLIC_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.create_release == 'true' }}
      HAS_WIN_CERTIFICATE: ${{ secrets.WIN_CERTIFICATE_BASE64 != '' }}
      HAS_WIN_CERTIFICATE_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download SVN binaries
        uses: actions/download-artifact@v7
        with:
          name: svn-win32-x64
          path: binaries/win32-x64

      - name: Download Logic Engine
        uses: actions/download-artifact@v7
        with:
          name: shelly-engine-win32-x64
          path: binaries/win32-x64

      - name: Verify bundled binaries
        run: bun run verify:binaries win32-x64

      - name: Cache Electron build output
        uses: actions/cache@v5
        with:
          path: |
            out
            .cache
          key: electron-out-win32-x64-${{ hashFiles('src/**/*', 'package.json', 'bun.lock') }}
          restore-keys: |
            electron-out-win32-x64-

      - name: Build frontend
        run: bun run build

      - name: Build Electron app (unsigned)
        if: ${{ env.HAS_WIN_CERTIFICATE == 'false' || env.HAS_WIN_CERTIFICATE_PASSWORD == 'false' }}
        run: bunx electron-builder --win --x64 --config --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Warn about unsigned public Windows release
        if: ${{ env.PUBLIC_RELEASE == 'true' && (env.HAS_WIN_CERTIFICATE == 'false' || env.HAS_WIN_CERTIFICATE_PASSWORD == 'false') }}
        shell: pwsh
        run: |
          Write-Warning "Building an unsigned public Windows release because signing credentials are incomplete."
          Write-Warning "Set WIN_CERTIFICATE_BASE64 and WIN_CERTIFICATE_PASSWORD before publishing a trusted Windows release."

      - name: Build Electron app (signed)
        if: ${{ env.HAS_WIN_CERTIFICATE == 'true' && env.HAS_WIN_CERTIFICATE_PASSWORD == 'true' }}
        run: |
          $certPath = Join-Path $env:TEMP "cert.pfx"
          [System.Convert]::FromBase64String($env:WIN_CERT_BASE64) | Set-Content $certPath -AsByteStream
          $env:CSC_LINK = $certPath
          $env:CSC_KEY_PASSWORD = $env:WIN_CERT_PASSWORD
          bunx electron-builder --win --x64 --config --publish never
          Remove-Item $certPath -Force -ErrorAction SilentlyContinue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CERT_BASE64: ${{ secrets.WIN_CERTIFICATE_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}

      - name: Validate public Windows artifact signature
        if: ${{ env.PUBLIC_RELEASE == 'true' && env.HAS_WIN_CERTIFICATE == 'true' && env.HAS_WIN_CERTIFICATE_PASSWORD == 'true' }}
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path release -Recurse -File -Include *.exe
          if (-not $artifacts) {
            Write-Error "No Windows executable artifacts found for signature validation."
          }

          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -FilePath $artifact.FullName
            if ($signature.Status -ne 'Valid') {
              Write-Error "Invalid signature for $($artifact.FullName): $($signature.Status)"
            }
            Write-Host "Valid Authenticode signature: $($artifact.FullName)"
          }

      - name: Smoke test packaged Windows app
        shell: pwsh
        run: |
          $app = Get-ChildItem -Path release -Recurse -File -Filter ShellySVN.exe |
            Where-Object { $_.FullName -like '*win-unpacked*' } |
            Select-Object -First 1
          if (-not $app) {
            Write-Error "No unpacked ShellySVN.exe found for smoke testing."
          }

          $expectedVersion = node -p "require('./package.json').version"
          $smokeOutput = & $app.FullName --smoke-test 2>&1
          $smokeOutput | Write-Host
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (($smokeOutput -join "`n") -notmatch [regex]::Escape("ShellySVN $expectedVersion")) {
            # Electron GUI executables do not reliably inherit stdout on Windows.
            # Fall back to the version embedded by electron-builder after proving
            # that the packaged executable starts and exits successfully.
            $productVersion = $app.VersionInfo.ProductVersion
            Write-Host "Packaged executable product version: $productVersion"
            $expectedProductVersion = "$(($expectedVersion -split '-')[0]).0"
            if ($productVersion -ne $expectedProductVersion) {
              Write-Error "Packaged app version did not match package.json version $expectedVersion (embedded product version '$productVersion')."
            }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ShellySVN-Windows-x64
          path: |
            release/**/*-setup.exe
            release/**/*.zip
            release/**/latest.yml
            release/**/*.blockmap
          retention-days: 7
          if-no-files-found: error

  # ============================================
  # Build Electron App - Linux
  # ============================================
  build-linux:
    needs: [release-readiness, svn-binaries, logic-engine]
    runs-on: ubuntu-22.04
    if: inputs.skip_linux != 'true'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download SVN binaries
        uses: actions/download-artifact@v7
        with:
          name: svn-linux-x64
          path: binaries/linux-x64

      - name: Download Logic Engine
        uses: actions/download-artifact@v7
        with:
          name: shelly-engine-linux-x64
          path: binaries/linux-x64

      - name: Make binaries executable
        run: |
          chmod +x binaries/linux-x64/shelly-engine || true
          chmod +x binaries/linux-x64/svn/svn || true

      - name: Verify bundled binaries
        run: bun run verify:binaries linux-x64

      - name: Cache Electron build output
        uses: actions/cache@v5
        with:
          path: |
            out
            .cache
          key: electron-out-linux-x64-${{ hashFiles('src/**/*', 'package.json', 'bun.lock') }}
          restore-keys: |
            electron-out-linux-x64-

      - name: Build frontend
        run: bun run build

      - name: Build Electron app
        run: bunx electron-builder --linux --x64 --config --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test packaged Linux app
        run: |
          set -euo pipefail
          app_path="$(find release -path '*linux-unpacked*' -type f -name 'ShellySVN' | head -n 1)"
          if [ -z "$app_path" ]; then
            echo "No unpacked Linux ShellySVN executable found for smoke testing."
            exit 1
          fi
          expected_version="$(node -p "require('./package.json').version")"
          smoke_output="$(xvfb-run -a "$app_path" --smoke-test --no-sandbox)"
          echo "$smoke_output"
          echo "$smoke_output" | grep -F "ShellySVN $expected_version"

      - name: Upload artifact (AppImage)
        uses: actions/upload-artifact@v6
        with:
          name: ShellySVN-Linux-x64-AppImage
          path: |
            release/**/*.AppImage
            release/**/latest-linux.yml
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload artifact (deb)
        uses: actions/upload-artifact@v6
        with:
          name: ShellySVN-Linux-x64-deb
          path: release/**/*.deb
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload artifact (tar.gz)
        uses: actions/upload-artifact@v6
        with:
          name: ShellySVN-Linux-x64-tarball
          path: release/**/*.tar.gz
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload artifact (rpm)
        uses: actions/upload-artifact@v6
        with:
          name: ShellySVN-Linux-x64-rpm
          path: release/**/*.rpm
          retention-days: 7
          if-no-files-found: ignore

  # ============================================
  # Release (only on tags or manual dispatch)
  # ============================================
  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.create_release == 'true') && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Install release validation dependencies
        run: bun install --frozen-lockfile

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: ShellySVN-*
          path: artifacts

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Merge macOS update metadata
        run: |
          set -euo pipefail
          x64_metadata="$(find artifacts/ShellySVN-macOS-x64 -name latest-mac.yml -print -quit)"
          arm64_metadata="$(find artifacts/ShellySVN-macOS-arm64 -name latest-mac.yml -print -quit)"
          node scripts/merge-mac-update-metadata.mjs artifacts/update-metadata/latest-mac.yml "$x64_metadata" "$arm64_metadata"

      - name: Validate release version and updater assets
        env:
          SKIP_LINUX: ${{ inputs.skip_linux }}
        run: |
          node scripts/validate-release-version.mjs "$GITHUB_REF_NAME" artifacts
          node scripts/validate-release-assets.mjs artifacts

      - name: List artifacts
        run: find artifacts -type f -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.tar.gz" | head -50

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ShellySVN v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## ShellySVN v${{ steps.get_version.outputs.VERSION }}

            ### Downloads

            #### Windows
            - `ShellySVN-x.x.x-x64-setup.exe` - Windows installer (x64)

            #### macOS
            - `ShellySVN-x.x.x-x64.dmg` - macOS Intel
            - `ShellySVN-x.x.x-arm64.dmg` - macOS Apple Silicon (M1/M2/M3)

            #### Linux
            - `ShellySVN-x.x.x-x64.AppImage` - Universal Linux binary
            - `ShellySVN-x.x.x-amd64.deb` - Debian/Ubuntu package
            - `ShellySVN-x.x.x.tar.gz` - Portable tarball

            ### System Requirements
            - **Windows**: Windows 10/11 (64-bit)
            - **macOS**: macOS 10.15 (Catalina) or later
            - **Linux**: glibc 2.17+ (Ubuntu 18.04+, Debian 10+, etc.)

            ### Release Scope
            This release is for the standalone ShellySVN desktop app. Native Windows Explorer and macOS Finder integration remains release-gated unless called out explicitly in this section.

            ### What's Changed
            See [commit history](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) for details.
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/ShellySVN-Windows-x64/**/latest.yml
            artifacts/ShellySVN-Windows-x64/**/*.blockmap
            artifacts/update-metadata/latest-mac.yml
            artifacts/**/*.AppImage
            artifacts/ShellySVN-Linux-x64-AppImage/**/latest-linux.yml
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.tar.gz
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
