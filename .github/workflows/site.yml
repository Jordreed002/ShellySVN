name: Site

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-build:
    name: Site Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/site/node_modules
          key: bun-site-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/site/package.json') }}
          restore-keys: |
            bun-site-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck site
        run: bun run --cwd apps/site typecheck

      - name: Build site
        run: bun run site:build

      - name: Upload static site artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: site-static-export
          path: apps/site/out/
          if-no-files-found: ignore
          retention-days: 7
