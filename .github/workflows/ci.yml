name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Clean install from lockfile
  # ============================================
  clean-install:
    name: Clean Install
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.0'

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Verify local toolchain is available
        run: |
          test -x node_modules/.bin/vitest
          test -x node_modules/.bin/oxlint
          bun run test:skips

  # ============================================
  # Lint and TypeCheck
  # ============================================
  lint-and-typecheck:
    name: Lint and TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: clean-install

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.0'

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeCheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check remote assets
        run: bun run check:remote-assets

  # ============================================
  # Real SVN Workflow Verification
  # ============================================
  real-svn-workflows:
    name: Real SVN Workflows (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs: clean-install
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install SVN toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion

      - name: Start reusable SVN compatibility lab (Linux)
        if: runner.os == 'Linux'
        run: |
          docker compose -f tests/fixtures/svn-compat-server/compose.yml up -d --build --wait
          echo "SHELLYSVN_DOCKER_SVN_TEST_URL=svn://127.0.0.1:36990/repo/sandbox" >> "$GITHUB_ENV"
          echo "SHELLYSVN_HTTP_TEST_URL=http://127.0.0.1:18080/svn/trunk" >> "$GITHUB_ENV"
          echo "SHELLYSVN_HTTPS_TEST_URL=https://127.0.0.1:18443/svn/trunk" >> "$GITHUB_ENV"
          echo "SHELLYSVN_PROTOCOL_USERNAME=shellysvn" >> "$GITHUB_ENV"
          echo "SHELLYSVN_PROTOCOL_PASSWORD=release-test" >> "$GITHUB_ENV"

      - name: Install SVN toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          svn --version --quiet && svnadmin --version --quiet || brew install subversion

      - name: Install SVN toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tortoisesvn -y --no-progress
          $svnBin = Join-Path $env:ProgramFiles 'TortoiseSVN\bin'
          $env:PATH = "$svnBin;$env:PATH"
          $svnBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          svn --version --quiet
          svnadmin --version --quiet

      - name: Verify real SVN workflows
        run: bun run verify:svn-workflows

      - name: Show SVN compatibility lab logs on failure
        if: failure() && runner.os == 'Linux'
        run: docker compose -f tests/fixtures/svn-compat-server/compose.yml logs --tail=300

      - name: Stop SVN compatibility lab
        if: always() && runner.os == 'Linux'
        run: docker compose -f tests/fixtures/svn-compat-server/compose.yml down --volumes

  # ============================================
  # Unit Tests with Coverage
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.0'

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test:coverage

      - name: Check skipped-test baseline
        run: bun run test:skips

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          fail_ci_if_error: false
          verbose: true

  # ============================================
  # Build Verification (without full electron-builder)
  # ============================================
  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck, unit-tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.0'

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Cache Electron build output
        uses: actions/cache@v5
        with:
          path: |
            out
            .cache
          key: electron-out-${{ runner.os }}-${{ hashFiles('src/**/*', 'package.json', 'bun.lock') }}
          restore-keys: |
            electron-out-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Verify build output
        run: |
          echo "Checking build output..."
          test -d out/main && echo "Main process built successfully"
          test -d out/preload && echo "Preload built successfully"
          test -d out/renderer && echo "Renderer built successfully"
          echo "Build verification complete!"

  # ============================================
  # E2E Tests (only on main/master push)
  # ============================================
  e2e-tests:
    name: E2E Tests
    runs-on: macos-14
    timeout-minutes: 30
    needs: [lint-and-typecheck, unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.0'

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app for testing
        run: bun run build

      - name: Install Playwright browsers
        run: bun run playwright install chromium

      - name: Run E2E tests
        run: bun run test:e2e
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-test-results
          path: tests/results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-test-report
          path: tests/report/
          if-no-files-found: ignore
          retention-days: 7
