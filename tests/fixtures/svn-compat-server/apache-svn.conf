Listen 8080
Listen 8443
ServerName localhost

<VirtualHost *:8080>
  <Location /svn>
    DAV svn
    SVNPath /var/lib/svn/repo
    AuthType Basic
    AuthName "ShellySVN compatibility lab"
    AuthUserFile /etc/apache2/shellysvn.passwd
    AuthzSVNAccessFile /var/lib/svn/repo/conf/authz
    Require valid-user
  </Location>
</VirtualHost>

<VirtualHost *:8443>
  SSLEngine on
  SSLCertificateFile /etc/apache2/shellysvn.crt
  SSLCertificateKeyFile /etc/apache2/shellysvn.key

  <Location /svn>
    DAV svn
    SVNPath /var/lib/svn/repo
    AuthType Basic
    AuthName "ShellySVN compatibility lab"
    AuthUserFile /etc/apache2/shellysvn.passwd
    AuthzSVNAccessFile /var/lib/svn/repo/conf/authz
    Require valid-user
  </Location>
</VirtualHost>
